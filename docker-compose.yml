# Layer A, locally (Step 9). Nothing here reaches AWS, a real model or a bank.
#
#   mkdir -p local-secrets && openssl rand -hex 16 > local-secrets/postgres_password \
#     && openssl rand -hex 16 > local-secrets/db_password \
#     && read -s -p "Founder password: " P && printf %s "$P" > local-secrets/founder_password \
#     && echo '{"email": "nominee@example.com"}' > local-secrets/nominee
#   chmod 700 local-secrets && chmod 644 local-secrets/*   # the folder stays private to you;
#   docker compose up --build                             # the container user must read the files
#
# Gateway API http://localhost:8080 · Founder app http://localhost:8081
# Direct Founder Controls http://localhost:8082 (dyson-control) · J read-only http://localhost:8083
#
# Four containers, as on AWS (LA-DEP-01 to LA-DEP-03): layer-a (A, B, C, D, G, I, E, F, H, J),
# controls (Direct Founder Controls alone, so STOP works when B, C or Hermes is down), hermes
# (on a network with no internet, no database and only Layer A's Hermes edge on it) and voice
# (the speech model that hears the Founder, D-024: no secrets, no database, no internet, and
# only Layer A on its network).
# The Founder's device key for dyson-control is in the secret store file inside the dyson-data
# volume (core.device_key); copy it to the device yourself. It is never printed.
services:
  postgres:
    # pgvector's image is the official postgres:16 plus the `vector` extension (same data layout,
    # drop-in). The knowledge layer stores embeddings here; CREATE EXTENSION is run by migrations.
    image: ${DYSON_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [core_net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  layer-a:
    build:
      context: .
      dockerfile: integration/docker/Dockerfile
      args:
        BASE_IMAGE: ${DYSON_PYTHON_IMAGE:-python:3.12-slim}
        PIP_NO_INDEX: ${DYSON_PIP_NO_INDEX:-}
    image: dyson/layer-a:local
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: &with_db ["sh", "-c", "export DYSON_PG_ADMIN=\"postgresql://postgres:$$(cat /run/secrets/postgres_password)@postgres:5432/postgres\" DYSON_DB_PASSWORD=\"$$(cat /run/secrets/db_password)\" && exec python -m dyson_integration.serve"]
    environment:
      DYSON_ROLE: core
      DYSON_BIND: 172.30.0.10  # the core network only: nothing on the Hermes network
      DYSON_EDGE_BIND: 172.31.0.10
      DYSON_HERMES_URL: http://172.31.0.20:8095
      DYSON_CONTROLS_URL: http://172.30.0.11:8082  # dashboard health check only
      DYSON_HERMES_SECRETS: /hermes/secrets.json
      DYSON_NOMINEE_FILE: /run/secrets/nominee
      DYSON_DB_NAME: dyson
      DYSON_SECRET_FILE: /data/secrets.json
      DYSON_FOUNDER_PASSWORD_FILE: /run/secrets/founder_password
      DYSON_POLICY_DIR: /app/policy
      DYSON_SECURE_COOKIES: ${DYSON_SECURE_COOKIES:-0}
      DYSON_PASSKEY_RP_ID: ${DYSON_PASSKEY_RP_ID:-localhost}
      DYSON_PASSKEY_ORIGIN: ${DYSON_PASSKEY_ORIGIN:-http://localhost:8082}
      DYSON_BEDROCK: ${DYSON_BEDROCK:-0}  # 1 only on the server (D-013)
      # OpenAI-compatible providers behind C (free-first). Keys are NOT here: the Founder saves each
      # on Direct Founder Controls, into the shared secret store, read fresh per call. apinex is a
      # relay (non-sensitive only); Groq and Gemini are direct. Set a URL empty to disable one.
      DYSON_APINEX_URL: ${DYSON_APINEX_URL:-https://api.apinex.bond/v1}
      DYSON_GROQ_URL: ${DYSON_GROQ_URL:-https://api.groq.com/openai/v1}
      DYSON_GEMINI_URL: ${DYSON_GEMINI_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      DYSON_POLLY: ${DYSON_POLLY:-0}  # 1 only on the server: spoken replies (D-024)
      DYSON_VOICE_URL: http://172.32.0.10:8096
      DYSON_SANDBOX_URL: http://172.35.0.10:8097  # G drives the sealed sandbox over sandbox_net
      DYSON_SELFTEST_URL: http://172.36.0.10:8099  # Layer A drives the sealed self-test runner
      DYSON_EMBEDDER_URL: http://172.30.0.30:8098  # local embeddings for the knowledge layer
      # The app serves the sandbox panel same-origin and bridges its screen's websocket to this
      # VNC address over sandbox_net — so there is no second hostname and the one app login covers
      # it. Interactive: the Founder can watch AND take control; Dyson drives through Playwright.
      DYSON_SANDBOX_VNC: ${DYSON_SANDBOX_VNC:-172.35.0.10:5900}
      DYSON_ENVIRONMENT: ${DYSON_ENVIRONMENT:-local}
      DYSON_RELEASE: ${DYSON_RELEASE:-}
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      AWS_DEFAULT_REGION: ap-southeast-2
    secrets: [postgres_password, db_password, founder_password, nominee]
    volumes:
      - dyson-data:/data
      - hermes-secrets:/hermes
      - ${DYSON_AWS_DIR:-./local-aws}:/run/aws:ro  # short-lived role credentials
    networks:
      core_net: {ipv4_address: 172.30.0.10}
      hermes_net: {ipv4_address: 172.31.0.10}
      voice_net: {ipv4_address: 172.32.0.2}
      sandbox_net: {ipv4_address: 172.35.0.2}  # to drive the sandbox and relay its screen
      selftest_net: {ipv4_address: 172.36.0.3}  # to drive the sealed self-test runner
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://172.30.0.10:8081/')"]
      interval: 5s
      retries: 60

  controls:
    image: dyson/layer-a:local
    pull_policy: never  # built by layer-a
    depends_on:
      layer-a: {condition: service_healthy}  # layer-a creates and migrates the database
    entrypoint: *with_db
    environment:
      DYSON_ROLE: controls
      DYSON_DB_NAME: dyson
      DYSON_SECRET_FILE: /data/secrets.json
      DYSON_FOUNDER_PASSWORD_FILE: /run/secrets/founder_password
      DYSON_POLICY_DIR: /app/policy
      DYSON_PASSKEY_RP_ID: ${DYSON_PASSKEY_RP_ID:-localhost}
      DYSON_PASSKEY_ORIGIN: ${DYSON_PASSKEY_ORIGIN:-http://localhost:8082}
    secrets: [postgres_password, db_password, founder_password]
    volumes: [dyson-data:/data]
    networks:
      core_net: {ipv4_address: 172.30.0.11}
    ports:
      - "127.0.0.1:8082:8082"

  hermes:
    image: dyson/layer-a:local
    pull_policy: never  # built by layer-a
    depends_on:
      layer-a: {condition: service_healthy}  # layer-a writes Hermes's credentials
    entrypoint: ["python", "-m", "dyson_integration.serve"]
    environment:
      DYSON_ROLE: hermes
      DYSON_EDGE_URL: http://172.31.0.10:8090
      DYSON_HERMES_SECRETS: /hermes/secrets.json
    volumes: [hermes-secrets:/hermes:ro]
    networks:
      hermes_net: {ipv4_address: 172.31.0.20}

  voice:
    build:
      context: .
      dockerfile: services/voice/Dockerfile
      args:
        BASE_IMAGE: ${DYSON_PYTHON_IMAGE:-python:3.12-slim}
    image: dyson/voice:local
    read_only: true
    tmpfs: [/tmp]
    cpus: 1.0  # hearing never starves the rest of Layer A
    mem_limit: 1g
    environment:
      DYSON_VOICE_BIND: 172.32.0.10
    networks:
      voice_net: {ipv4_address: 172.32.0.10}

  hermes-agent:
    # Nous Research Hermes Agent v0.22.2, the full image (with its desktop), pinned by digest
    # (D-025). Installed and isolated: no route anywhere, no model, no secrets, nothing calls
    # it. The Founder decides its wiring before it is admitted.
    #
    # Archived after the Milestone A benchmark (D-027, D-023): Dyson's own engine matched it on
    # completion and beat it on latency and governance, so the Nous agent is no longer run. The
    # image stays pinned and its data volume is kept (archive, never delete), but the "archived"
    # compose profile keeps `docker compose up` from starting it. To bring it back for a future,
    # Founder-admitted purpose: docker compose --profile archived up -d hermes-agent.
    profiles: ["archived"]
    image: nousresearch/hermes-agent:v0.22.2-desktop@sha256:79c98751d8d772ac0f7bfc31a75b123b9cfac254c2e15e4d0ac8762d6b119212
    command: ["sleep", "infinity"]
    cpus: 1.0
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]
    volumes: [hermes-agent-data:/opt/data]
    networks: [hermes_agent_net]

  sandbox:
    # The Founder's sealed cloud sandbox (D-026, Dyson-native): Chromium via Playwright, its screen
    # relayed view-only to the dashboard. Starts only under the "sandbox" profile, and only after
    # the Founder admits dyson.receptor.sandbox on Direct Founder Controls. It sits on sandbox_net,
    # which has internet (to browse) but — by Docker network isolation and the entrypoint's egress
    # firewall — no route to the core, Layer A or the database. It holds no secret and no model;
    # Layer A's engine does the thinking through C and drives it over this network.
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
      args:
        BASE_IMAGE: ${DYSON_PYTHON_IMAGE:-python:3.12-slim}
    image: dyson/sandbox:local
    cpus: 1.0
    mem_limit: 1536m
    cap_add: ["NET_ADMIN"]  # only to install its own egress firewall at start-up
    security_opt: ["no-new-privileges:true"]
    environment:
      DYSON_SANDBOX_BIND: 172.35.0.10
    networks:
      sandbox_net: {ipv4_address: 172.35.0.10}

  selftest:
    # Dyson's sealed self-test runner (Phase A): runs the repo's own ruff + pytest and reports
    # pass/fail. The foundation for self-development — a change is validated here before it is ever
    # proposed. Starts only under the "selftest" profile, and only after the Founder admits the
    # self-test receptor on Direct Founder Controls. On selftest_net (internal: no internet); the
    # entrypoint seals egress to all but its throwaway Postgres, so it cannot reach the core even
    # while running model-written code. It holds no secret and no model; Layer A drives it.
    profiles: ["selftest"]
    build:
      context: .
      dockerfile: services/selftest/Dockerfile
      args:
        BASE_IMAGE: ${DYSON_PYTHON_IMAGE:-python:3.12-slim}
    image: dyson/selftest:local
    cpus: 2.0
    mem_limit: 2048m
    cap_add: ["NET_ADMIN"]  # only to install its own egress firewall at start-up
    security_opt: ["no-new-privileges:true"]
    environment:
      DYSON_SELFTEST_BIND: 172.36.0.10
      DYSON_SELFTEST_PG: postgresql://postgres@172.36.0.2:5432/postgres
      DYSON_SELFTEST_PG_HOST: "172.36.0.2"
      DYSON_SELFTEST_PG_IP: "172.36.0.2"
    depends_on:
      selftest-pg: {condition: service_healthy}
    networks:
      selftest_net: {ipv4_address: 172.36.0.10}

  selftest-pg:
    # A throwaway Postgres for the self-test run only, on the sealed selftest network. No volume: it
    # starts empty every time, holds nothing, and is reachable only by the self-test runner.
    profiles: ["selftest"]
    image: ${DYSON_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      selftest_net: {ipv4_address: 172.36.0.2}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedder:
    # Local embedding model for the knowledge layer: EmbeddingGemma 300M (768-dim, multilingual)
    # served by llama.cpp as an OpenAI-compatible /v1/embeddings endpoint. The Founder's files are
    # embedded here so text and vectors never leave the box (~140MB RAM, ungated GGUF). Starts only
    # under the "knowledge" profile; the model is cached in a volume so restarts don't re-download.
    profiles: ["knowledge"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-hf", "ggml-org/embeddinggemma-300M-GGUF", "--embeddings",
              "--host", "0.0.0.0", "--port", "8098", "--ctx-size", "2048",
              # batch/ubatch must cover a whole chunk, else a long sequence 500s on embedding
              "--batch-size", "2048", "--ubatch-size", "2048"]
    # The image's own healthcheck probes port 8080; we serve on 8098, so point it there instead.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8098/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s  # first run downloads the model; cached in the volume afterwards
    environment:
      LLAMA_CACHE: /models
    cpus: 1.0
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    volumes: [embedder-models:/models]
    networks:
      core_net: {ipv4_address: 172.30.0.30}

networks:
  core_net:
    ipam: {config: [{subnet: 172.30.0.0/24}]}
  hermes_net:
    internal: true  # no route out: Hermes reaches only Layer A's edge
    ipam: {config: [{subnet: 172.31.0.0/24}]}
  voice_net:
    internal: true  # no route out: the voice model talks only to Layer A
    ipam: {config: [{subnet: 172.32.0.0/24}]}
  hermes_agent_net:
    internal: true  # Hermes Agent alone: no internet, no Layer A, nothing else
    ipam: {config: [{subnet: 172.33.0.0/24}]}
  sandbox_net:
    # NOT internal: the sandbox browser needs the open web. Docker still isolates this network
    # from the others, and the sandbox's egress firewall refuses every private range, so it
    # cannot reach the core, Layer A or the database. Only Layer A joins it, to drive the sandbox.
    ipam: {config: [{subnet: 172.35.0.0/24}]}
  selftest_net:
    internal: true  # no internet: the tests are hermetic. Only Layer A and the throwaway Postgres
    # join it, and the runner's own egress firewall refuses everything but that Postgres.
    ipam: {config: [{subnet: 172.36.0.0/24}]}

volumes:
  pgdata: {}
  dyson-data: {}
  hermes-secrets: {}
  hermes-agent-data: {}
  embedder-models: {}

secrets:
  postgres_password:
    file: ./local-secrets/postgres_password
  db_password:
    file: ./local-secrets/db_password
  founder_password:
    file: ./local-secrets/founder_password
  nominee:  # AMD-12 nominee (from /dyson/nominee on the server; locally any {"email": ...})
    file: ./local-secrets/nominee
