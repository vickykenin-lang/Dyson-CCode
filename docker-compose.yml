# Layer A, locally (Step 9). Nothing here reaches AWS, a real model or a bank.
#
#   mkdir -p local-secrets && openssl rand -hex 16 > local-secrets/postgres_password \
#     && openssl rand -hex 16 > local-secrets/db_password \
#     && read -s -p "Founder password: " P && printf %s "$P" > local-secrets/founder_password \
#     && echo '{"email": "nominee@example.com"}' > local-secrets/nominee
#   chmod 700 local-secrets && chmod 644 local-secrets/*   # the folder stays private to you;
#   docker compose up --build                             # the container user must read the files
#
# Gateway API http://localhost:8080 · Founder app http://localhost:8081
# Direct Founder Controls http://localhost:8082 (dyson-control) · J read-only http://localhost:8083
#
# Four containers, as on AWS (LA-DEP-01 to LA-DEP-03): layer-a (A, B, C, D, G, I, E, F, H, J),
# controls (Direct Founder Controls alone, so STOP works when B, C or Hermes is down), hermes
# (on a network with no internet, no database and only Layer A's Hermes edge on it) and voice
# (the speech model that hears the Founder, D-024: no secrets, no database, no internet, and
# only Layer A on its network).
# The Founder's device key for dyson-control is in the secret store file inside the dyson-data
# volume (core.device_key); copy it to the device yourself. It is never printed.
services:
  postgres:
    image: ${DYSON_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [core_net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  layer-a:
    build:
      context: .
      dockerfile: integration/docker/Dockerfile
      args:
        BASE_IMAGE: ${DYSON_PYTHON_IMAGE:-python:3.12-slim}
        PIP_NO_INDEX: ${DYSON_PIP_NO_INDEX:-}
    image: dyson/layer-a:local
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: &with_db ["sh", "-c", "export DYSON_PG_ADMIN=\"postgresql://postgres:$$(cat /run/secrets/postgres_password)@postgres:5432/postgres\" DYSON_DB_PASSWORD=\"$$(cat /run/secrets/db_password)\" && exec python -m dyson_integration.serve"]
    environment:
      DYSON_ROLE: core
      DYSON_BIND: 172.30.0.10  # the core network only: nothing on the Hermes network
      DYSON_EDGE_BIND: 172.31.0.10
      DYSON_HERMES_URL: http://172.31.0.20:8095
      DYSON_CONTROLS_URL: http://172.30.0.11:8082  # dashboard health check only
      DYSON_HERMES_SECRETS: /hermes/secrets.json
      DYSON_NOMINEE_FILE: /run/secrets/nominee
      DYSON_DB_NAME: dyson
      DYSON_SECRET_FILE: /data/secrets.json
      DYSON_FOUNDER_PASSWORD_FILE: /run/secrets/founder_password
      DYSON_POLICY_DIR: /app/policy
      DYSON_SECURE_COOKIES: ${DYSON_SECURE_COOKIES:-0}
      DYSON_PASSKEY_RP_ID: ${DYSON_PASSKEY_RP_ID:-localhost}
      DYSON_PASSKEY_ORIGIN: ${DYSON_PASSKEY_ORIGIN:-http://localhost:8082}
      DYSON_BEDROCK: ${DYSON_BEDROCK:-0}  # 1 only on the server (D-013)
      DYSON_POLLY: ${DYSON_POLLY:-0}  # 1 only on the server: spoken replies (D-024)
      DYSON_VOICE_URL: http://172.32.0.10:8096
      DYSON_ENVIRONMENT: ${DYSON_ENVIRONMENT:-local}
      DYSON_RELEASE: ${DYSON_RELEASE:-}
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      AWS_DEFAULT_REGION: ap-southeast-2
    secrets: [postgres_password, db_password, founder_password, nominee]
    volumes:
      - dyson-data:/data
      - hermes-secrets:/hermes
      - ${DYSON_AWS_DIR:-./local-aws}:/run/aws:ro  # short-lived role credentials
    networks:
      core_net: {ipv4_address: 172.30.0.10}
      hermes_net: {ipv4_address: 172.31.0.10}
      voice_net: {ipv4_address: 172.32.0.2}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://172.30.0.10:8081/')"]
      interval: 5s
      retries: 60

  controls:
    image: dyson/layer-a:local
    pull_policy: never  # built by layer-a
    depends_on:
      layer-a: {condition: service_healthy}  # layer-a creates and migrates the database
    entrypoint: *with_db
    environment:
      DYSON_ROLE: controls
      DYSON_DB_NAME: dyson
      DYSON_SECRET_FILE: /data/secrets.json
      DYSON_FOUNDER_PASSWORD_FILE: /run/secrets/founder_password
      DYSON_POLICY_DIR: /app/policy
      DYSON_PASSKEY_RP_ID: ${DYSON_PASSKEY_RP_ID:-localhost}
      DYSON_PASSKEY_ORIGIN: ${DYSON_PASSKEY_ORIGIN:-http://localhost:8082}
    secrets: [postgres_password, db_password, founder_password]
    volumes: [dyson-data:/data]
    networks:
      core_net: {ipv4_address: 172.30.0.11}
    ports:
      - "127.0.0.1:8082:8082"

  hermes:
    image: dyson/layer-a:local
    pull_policy: never  # built by layer-a
    depends_on:
      layer-a: {condition: service_healthy}  # layer-a writes Hermes's credentials
    entrypoint: ["python", "-m", "dyson_integration.serve"]
    environment:
      DYSON_ROLE: hermes
      DYSON_EDGE_URL: http://172.31.0.10:8090
      DYSON_HERMES_SECRETS: /hermes/secrets.json
    volumes: [hermes-secrets:/hermes:ro]
    networks:
      hermes_net: {ipv4_address: 172.31.0.20}

  voice:
    build:
      context: .
      dockerfile: services/voice/Dockerfile
      args:
        BASE_IMAGE: ${DYSON_PYTHON_IMAGE:-python:3.12-slim}
    image: dyson/voice:local
    read_only: true
    tmpfs: [/tmp]
    cpus: 1.0  # hearing never starves the rest of Layer A
    mem_limit: 1g
    environment:
      DYSON_VOICE_BIND: 172.32.0.10
    networks:
      voice_net: {ipv4_address: 172.32.0.10}

  hermes-agent:
    # Nous Research Hermes Agent v0.22.2, the full image (with its desktop), pinned by digest
    # (D-025). Installed and isolated: no route anywhere, no model, no secrets, nothing calls
    # it. The Founder decides its wiring before it is admitted.
    #
    # Archived after the Milestone A benchmark (D-027, D-023): Dyson's own engine matched it on
    # completion and beat it on latency and governance, so the Nous agent is no longer run. The
    # image stays pinned and its data volume is kept (archive, never delete), but the "archived"
    # compose profile keeps `docker compose up` from starting it. To bring it back for a future,
    # Founder-admitted purpose: docker compose --profile archived up -d hermes-agent.
    profiles: ["archived"]
    image: nousresearch/hermes-agent:v0.22.2-desktop@sha256:79c98751d8d772ac0f7bfc31a75b123b9cfac254c2e15e4d0ac8762d6b119212
    command: ["sleep", "infinity"]
    cpus: 1.0
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]
    volumes: [hermes-agent-data:/opt/data]
    networks: [hermes_agent_net]

networks:
  core_net:
    ipam: {config: [{subnet: 172.30.0.0/24}]}
  hermes_net:
    internal: true  # no route out: Hermes reaches only Layer A's edge
    ipam: {config: [{subnet: 172.31.0.0/24}]}
  voice_net:
    internal: true  # no route out: the voice model talks only to Layer A
    ipam: {config: [{subnet: 172.32.0.0/24}]}
  hermes_agent_net:
    internal: true  # Hermes Agent alone: no internet, no Layer A, nothing else
    ipam: {config: [{subnet: 172.33.0.0/24}]}

volumes:
  pgdata: {}
  dyson-data: {}
  hermes-secrets: {}
  hermes-agent-data: {}

secrets:
  postgres_password:
    file: ./local-secrets/postgres_password
  db_password:
    file: ./local-secrets/db_password
  founder_password:
    file: ./local-secrets/founder_password
  nominee:  # AMD-12 nominee (from /dyson/nominee on the server; locally any {"email": ...})
    file: ./local-secrets/nominee
