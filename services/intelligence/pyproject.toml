[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dyson-intelligence"
version = "0.1.0"
description = "Dyson Sphere Layer A intelligence plane: Conversation Engine (B), Model Router (C), Hermes runtime"
requires-python = ">=3.12"
dependencies = [
    "dyson-contracts",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["pytest", "pyyaml>=6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dyson_intelligence = ["migrations/*.sql"]
