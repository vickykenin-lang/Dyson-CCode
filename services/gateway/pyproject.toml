[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dyson-gateway"
version = "0.1.0"
description = "Dyson Sphere Layer A Entry Gateway: Founder identity, sessions, rate limiting"
requires-python = ">=3.12"
dependencies = [
    "dyson-contracts",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
