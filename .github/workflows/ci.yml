# Continuous integration only: lint and tests on every push and pull request.
# GitHub is source control and CI, never part of Dyson's runtime (LA-SEC-06, LA-G-07).
# No deploy, no secrets, no scheduled jobs here. The Postgres service is a throwaway test database.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DYSON_TEST_PG_ADMIN: postgresql://postgres:ci-only-test-password@localhost:5432/postgres
      DYSON_TEST_REQUIRE_DB: "1"
      DYSON_TEST_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e contracts -e "services/memory[dev]" -e "services/governance[dev]" -e "services/toolhub[dev]" -e "services/orchestrator[dev]" -e "services/assurance[dev]" -e "services/intelligence[dev]" -e "services/gateway[dev]" -e "services/founder-controls[dev]" -e "services/voice[dev]" -e "apps/founder-app[dev]" -e "integration[dev]" "pyyaml>=6" pytest ruff
          pg_dump --version
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
