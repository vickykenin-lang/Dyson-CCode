# Founder decisions on the PRD's open Derived items.
# Recorded 2026-10-15 in the Claude Code session that produced Step 1.
# D-001..D-004 close PRD section 14 open items 1, 2, 3 and 8. None of them change AMD-1..AMD-14.
decisions:
- id: D-001
  date: '2026-10-15'
  closes: PRD §14 open item 1
  topic: Task state names
  decision: >-
    Use the closure (§9) names: accepted, approval-needed, running, held, stopped, failed,
    completed-verified. Keep closed as the housekeeping end state.
- id: D-002
  date: '2026-10-15'
  closes: PRD §14 open item 2
  topic: What PAUSE does to a task
  decision: >-
    PAUSE moves an active task to held. It waits there until an authorized RESUME
    or a reviewer / Founder decision.
- id: D-003
  date: '2026-10-15'
  closes: PRD §14 open item 3
  topic: End state after a Founder Reject
  decision: >-
    A rejected approval moves the task to rejected, then closed. A rejected task can never
    be restarted; a changed mind needs a new instruction.
- id: D-004
  date: '2026-10-15'
  closes: PRD §14 open item 8
  topic: Plane mapping (AMD-1)
  decision: Accept the PRD section 6 plane mapping as written. See policy/planes.yaml.
- id: D-005
  date: '2026-10-15'
  closes: Execution plan stack question
  topic: Technology stack
  decision: >-
    Python 3.12+, FastAPI for service endpoints, PostgreSQL 16, pydantic for contracts,
    pytest for tests, Docker Compose for local runs. App screens are served from Python
    until Step 8 decides whether voice needs a heavier front end.
- id: D-006
  date: '2026-10-15'
  closes: Execution plan repository question
  topic: Repository and first branch
  decision: >-
    New repository vickykenin-lang/dyson-ccode, kept separate from earlier work.
    Step 1 is the first commit on main.
- id: D-007
  date: '2026-10-15'
  closes: PRD §9 Derived rows stopped -> running and held -> running
  topic: Where RESUME sends a task
  decision: >-
    RESUME returns a task to the state it was in when STOP or PAUSE hit it. A task paused
    while waiting for approval returns to approval-needed; it never skips the Founder's
    approval and runs.
- id: D-008
  date: '2026-10-15'
  closes: Step 3 open parameter (PRD gives no figure for bounded recovery)
  topic: Recovery attempt limit
  decision: >-
    recovery_attempt_limit is 3. Each incident may have 3 recorded recovery attempts; after
    that it escalates to the Founder, and only a Founder approval allows more. Changing the
    value later needs a Founder-approved operational-parameter proposal.
- id: D-009
  date: '2026-10-15'
  closes: Step 6 open item (how a silent or failing Receptor is followed up)
  topic: Founder alerts and reminders from Monitoring
  decision: >-
    Every issue Monitoring raises (silent, unverified, failing or repeatedly failing) is brought
    to the Founder and stays open. Dyson reminds the Founder every hour until the Founder acts
    on it or says to keep it on hold. A Receptor recovering on its own does not close the
    alert. How long a Receptor may stay silent before it counts as unverified (stale_after) is
    still to be set.
- id: D-010
  date: '2026-10-15'
  closes: Step 6 open parameter repeated_failure_threshold
  topic: Repeated failure threshold
  decision: >-
    repeated_failure_threshold is 3: three bad health reports in a row count as repeated
    failure. Changing it later needs a Founder-approved operational-parameter proposal.
- id: D-011
  date: '2026-10-15'
  closes: Step 6 open parameter stale_after
  topic: How long a Receptor may stay silent
  decision: >-
    stale_after is 3 days. A Receptor with no health report for 3 days shows as unverified,
    and that issue goes to the Founder with hourly reminders under D-009. Changing it later
    needs a Founder-approved operational-parameter proposal.
- id: D-012
  date: '2026-10-16'
  closes: Implementation gate 1 (AWS account verification and spend cap)
  topic: AWS account for Step 10
  decision: >-
    A fresh AWS account named Dyson Sphere on the AWS Free plan, region ap-southeast-2
    (Sydney). Total spend for the first phase is capped at the plan's 100.00 USD of credits,
    which end after 180 days (12 Apr 2027); AWS access stops when the credits are used up or
    the period ends, whichever comes first. The Founder will top up after the free period,
    expecting revenue to fund infrastructure from about six months on. Until then nothing
    may be provisioned that cannot run inside these credits.
- id: D-013
  date: '2026-10-16'
  closes: Implementation gate 2 (compute, network, database, backups, IAM, secrets)
  topic: AWS infrastructure within the free-plan credits
  decision: >-
    One small fixed-price server in ap-southeast-2 (about 2 vCPU and 2 to 4 GB; Lightsail or
    EC2, whichever the price page shows is cheaper) runs Layer A, Postgres, Direct Founder
    Controls and Hermes as separate containers; no managed database for now. Of the 100 USD:
    infrastructure at most 60 USD for the 180 days, model calls at most 30 USD in total
    (enforced by the Model Router's budget), 10 USD in reserve; if the cheapest suitable
    server would pass 60 USD, stop and ask the Founder before creating it. Budget alerts at
    25, 50, 75 and 90 USD used; at 95 USD everything stops except backups. Only the Gateway
    and Direct Founder Controls are public, with TLS, at dyson.designinfra.in and
    control.designinfra.in; DNS for designinfra.in is managed at GoDaddy. Nightly encrypted
    database dumps go to one S3 bucket with versioning and Object Lock that the application
    cannot delete; a restore is tested before launch. One least-privilege role for the
    server, no long-lived keys on it, secrets in SSM Parameter Store (standard tier), and a
    monthly usage review. Models: Amazon Bedrock in ap-southeast-2 behind the Model Router,
    the cheapest model that passes the Founder's bar on real Dyson tasks chosen by benchmark,
    with the stand-in model kept as the fallback.
- id: D-014
  date: '2026-10-16'
  closes: Implementation gate 3 (step-up authentication and signed approvals)
  topic: Founder confirmation method and approval expiry
  decision: >-
    A passkey on the Founder's phone confirms every approval, rejection, STOP, PAUSE and
    resume request on Direct Founder Controls, with a second passkey kept as backup. An
    unanswered approval expires after 24 hours and must be asked again; the Founder is
    reminded hourly while it waits.
- id: D-015
  date: '2026-10-16'
  closes: Implementation gate 4 (STOP for running actions; high-risk classification)
  topic: STOP handling and high-risk actions
  decision: >-
    STOP blocks every new tool call at once. A call already sent may finish, but its result
    waits for the Founder's review; nothing continues or rolls back on its own. High risk,
    always needing Founder approval: spending money, publishing outside Dyson, contacting a
    customer, deleting data, changing a Receptor's limits.
- id: D-016
  date: '2026-10-16'
  closes: Implementation gate 5 for this phase (voice)
  topic: Voice deferred
  decision: >-
    No voice in this phase. Layer A runs text only on AWS; the voice benchmark runs after the
    account is topped up.
- id: D-017
  date: '2026-10-16'
  closes: Implementation gate 6 (retention, classification, isolation, redaction)
  topic: Data policy for the first AWS phase
  decision: >-
    Conversations, decisions and evidence are kept permanently and deleted only on the
    Founder's request. No voice audio is stored. From bank statements only the parsed fields
    are kept, never the file. Personal and financial data never goes to an outside model.
    Only Test T0 runs on AWS until a real Receptor is approved.
- id: D-018
  date: '2026-10-16'
  closes: Server size for Step 10 (amends the 60 USD infrastructure cap in D-013)
  topic: Server above the infrastructure cap
  decision: >-
    One Lightsail server with 2 vCPU, 4 GB memory and 80 GB disk in ap-southeast-2. Spend may
    pass the 60 USD infrastructure cap and the 100 USD of credits; the Founder covers it with
    further AWS credits or a top-up. It has a public IPv4 address because an IPv6-only server
    cannot reach GitHub or be managed from the deployment session. It registers with Systems
    Manager, so it gets short-lived role credentials and no long-lived keys are kept on it.
    The budget alerts of D-013 stay as they are.
- id: D-019
  date: '2026-10-17'
  closes: AMD-4 acceptance bar and model choice for conversation.interpret
  topic: First real model behind C
  decision: >-
    DeepSeek v3.2 on Amazon Bedrock in ap-southeast-2 serves conversation.interpret. The
    acceptance bar is 90% of real benchmark tasks passed and a p95 latency of at most 5,000 ms;
    on the 26-command benchmark of 17 Oct 2026 it passed 25 (96%) with p95 3,423 ms at about
    0.00074 USD a command. Its daily budget is 0.16 USD, within D-013's 30 USD for model calls.
    The stand-in models stay registered but no longer meet the bar (they passed 18 of 26).
- id: D-020
  date: '2026-10-17'
  closes: Gate 9, disaster recovery (recovery point)
  topic: How much data a disaster may lose
  decision: >-
    Up to 24 hours of data may be lost. The nightly encrypted backup at 21:00 UTC (D-013)
    stays the recovery point; no more frequent backups. Acceptance and production
    authorization (the rest of gate 9) are decided separately.
- id: D-021
  date: '2026-10-17'
  closes: Gate 9, disaster recovery (recovery time)
  topic: How long Dyson may be down after losing its server
  decision: >-
    Up to 2 hours. Recovery is a new server registered with Systems Manager, deploy.sh, then
    restore.sh (newest database backup and the encrypted /data backup), then tunnel.sh. The
    drill of 17 Oct 2026 rebuilt a separate server from the backups in about 8 minutes, with
    the same tasks, evidence, approvals and passkey, and ran a T0 task to completed-verified.
- id: D-022
  date: '2026-10-18'
  closes: Gate 9, acceptance and production authorization
  topic: Layer A accepted and authorized for production
  decision: >-
    The Founder accepts Layer A as deployed on AWS (release layer-a-5b93d04 and later docs-only
    changes) and authorizes it as production. Accepted on this evidence: Founder login and
    passkey step-up; commands in English, Hindi and Hinglish through DeepSeek v3.2 (D-019);
    Test T0 tasks reaching AMD-3 stages 5 to 7 on AWS; STOP and approvals on Direct Founder
    Controls; nightly backups with a restore test and a disaster-recovery drill (D-020, D-021);
    the hourly spend guard. Only Test T0 runs until a real Receptor is approved (D-017). Voice
    stays deferred (D-016) and AMD-12's automatic trigger stays off (gate 7).
- id: D-023
  date: '2026-10-18'
  closes: How a deletion request is handled (amends D-017)
  topic: Archive, never delete
  decision: >-
    Nothing the Founder said or Dyson recorded is deleted. A conversation the Founder no longer
    wants in view is archived: it leaves the open list, stays complete in memory, evidence and
    the audit log, and can be restored at any time. Archiving needs no approval because it
    removes nothing. D-017's "deleted only on the Founder's request" now means archived.
- id: D-024
  date: '2026-10-19'
  closes: Implementation gate 5 (voice), reopened; amends D-016
  topic: Voice starts, heard on Dyson's own server
  decision: >-
    Voice is built now and kept central. The Founder's voice is heard on Dyson's own server in
    Sydney by an open speech model (AI4Bharat IndicConformer for Hindi, MIT, fetched once at a
    pinned version and checked by hash), in a container with no internet, no secrets and no
    database that only Layer A can reach. No outside speech service hears the Founder. Audio is
    never stored (D-017). Dyson's replies are spoken by Amazon Polly in Sydney, which never
    receives a personal identifier. A transcript is text like any other: C hides personal data
    before any model sees it, and every command goes through B, D and governance as before. A
    transcript Dyson is unsure of is shown to the Founder to confirm, never acted on silently.
    STOP, PAUSE and approvals stay on Direct Founder Controls. Amazon Transcribe is not used: the
    account stays on the AWS free plan, where it is closed. Accuracy and speed thresholds are set
    from a benchmark on the Founder's own recordings, then confirmed by the Founder.
- id: D-025
  date: '2026-10-20'
  closes: Hermes installation (zone 4); amends nothing
  topic: Hermes Agent installed on Dyson's server, isolated until its wiring is decided
  decision: >-
    Nous Research's Hermes Agent (MIT) is installed at full capacity: the official v0.22.2 image
    with its desktop, pinned by digest, in its own container on Dyson's server in Sydney. It sits
    alone on a network with no route to the internet, to Layer A or to anything else, holds no
    model, key or secret, and nothing calls it. The Supply Chain / Integration Gate records it as
    high risk and ISOLATED. The Founder decides later which providers, gateways and models it
    uses, how it is wired and its place in Dyson; it is admitted only on that decision and an
    approval on Direct Founder Controls. Until then every Hermes rule stands (LA-HER-01 to
    LA-HER-08): models only through C, tools only through G, the Founder talks only to Dyson.
- id: D-026
  date: '2026-10-20'
  closes: Opens the Jarvis build; sets the extension contract
  topic: Dyson builds Hermes's abilities into its own engine; anything new enters as a capability
  decision: >-
    Dyson will build the technical abilities of Hermes Agent into its own governed engine (zone 7,
    the Power Cluster): an agent loop, subagents, long-term personal memory, self-written and
    self-improving skills, a browser and desktop, and scheduled work. The engine uses models only
    through C and tools only through G; a new skill it writes stays proposed until the Supply Chain
    Gate admits it; it never grades its own work (F verifies), and memory changes go through a
    proposal queue, not silent rewrites. Hermes's own outside paths and paid services are not
    taken: no messaging gateways, no Nous Portal or Tool Gateway, no other compute backends, no
    model-training trajectory tooling. The installed Hermes Agent stays isolated as the study and
    benchmark copy, and is archived (not deleted, D-023) once Dyson's engine matches or beats it.
    To let any new thing be adopted later without changing the core, every new capability — a
    tool, model, connector, skill, agent, process, channel or whole cluster — enters through the
    Gate as a signed, digest-pinned manifest (dyson_contracts.capability) that declares its
    operations, risk, Rule-of-Two data flags, requested hosts/secrets/models, budget and isolation
    tier. The Gate verifies it (never trusts its hints), pins each operation's hash, and a later
    hash change auto-disables it. Low and medium risk admit once checked; high risk, anything
    external, or all three Rule-of-Two flags need a Founder approval on Direct Founder Controls.
    REA (morluto/rea, MIT) is recorded as a development-only reverse-engineering tool, never on the
    production server.
- id: D-027
  date: '2026-10-20'
  closes: Milestone A; amends nothing (bounded by D-025)
  topic: Hermes is wired to a model through C for a time-boxed benchmark, then re-isolated
  decision: >-
    For the Milestone A benchmark the installed Nous Hermes Agent is given a model, and only a
    model, through the Model Router (C): an OpenAI-compatible shim inside Layer A forwards its
    chat calls to C with the Hermes credential and a fixed benchmark task class, so Hermes holds
    no key of its own, reaches no provider directly, and cannot change the model or the budget
    (LA-HER-02, LA-RTR-01). Its network gains a route to that shim and to nothing else; it still
    has no internet, no Layer A data and no secrets. Its tools for the benchmark run through G
    with real side effects denied, so the run measures reasoning and tool-choice, not live action.
    This is a bounded change: the Founder admits it on Direct Founder Controls, it lasts only for
    the benchmark, and afterwards Hermes is re-isolated and then archived once Dyson's engine
    matches or beats it (D-025, D-023). The model spend stays inside C's budget and the hourly
    guard.
