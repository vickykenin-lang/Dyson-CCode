[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dyson-integration"
version = "0.1.0"
description = "Dyson Sphere Layer A Step 9: the real components connected, plus the Test T0 Receptor"
requires-python = ">=3.12"
dependencies = [
    "dyson-contracts",
    "dyson-memory",
    "dyson-governance",
    "dyson-toolhub",
    "dyson-orchestrator",
    "dyson-assurance",
    "dyson-intelligence",
    "dyson-gateway",
    "dyson-founder-controls",
    "dyson-founder-app",
    "pyyaml>=6",
    "uvicorn>=0.29",
    "httpx>=0.27",  # in-process ASGI calls between the composed apps
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dyson_integration = ["migrations/*.sql"]
