# Repository-level tool settings. Each component is its own package under its folder.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "tests", "services/memory/tests", "services/governance/tests"]

[tool.ruff.lint.isort]
known-first-party = ["dyson_contracts", "dyson_memory", "dyson_governance"]
