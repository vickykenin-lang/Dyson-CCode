[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dyson-founder-app"
version = "0.1.0"
description = "Dyson Sphere Founder app: text-first conversation with live, honest task status"
requires-python = ">=3.12"
dependencies = [
    "dyson-contracts",
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dyson_founder_app = ["static/*"]
